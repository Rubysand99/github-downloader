name: Tao debug keystore (chay 1 lan)

# Workflow dùng 1 lần: tạo debug.keystore mới và đưa bản base64 vào Artifacts để
# dán vào secret DEBUG_KEYSTORE_BASE64. Dùng xong hãy XOÁ artifact và file này.
on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Tạo keystore + base64
        run: |
          mkdir out
          keytool -genkeypair -keystore out/debug.keystore -storetype PKCS12 \
            -storepass android -keypass android -alias AndroidDebugKey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          keytool -list -keystore out/debug.keystore -storepass android -alias AndroidDebugKey
          base64 -w0 out/debug.keystore > out/keystore_b64.txt

      - name: Upload (giữ 1 ngày)
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: out/
          retention-days: 1
